name: CI

# Branch pushes are covered by their pull_request run; only main gets a push run.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    outputs:
      docs_only: ${{ steps.scope.outputs.docs_only }}
    # Runs without the optional rubydex group so the NullBackend path stays covered.
    # Pinned: ubuntu-latest migrates to 26.04 starting 2026-10-19; pin for reproducible runs.
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      # Same rule as docs_path? in bin/check_ci_parity; keep the two in sync.
      # The `test` job must still report (branch protection requires it), so
      # docs-only PRs skip the heavy steps instead of skipping the workflow.
      # Pushes to main always run everything.
      - name: Classify change scope
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          docs_only=false
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            changed="$(git diff --name-only "$BASE_SHA...$HEAD_SHA")"
            printf 'Changed files:\n%s\n' "$changed"
            if [ -n "$changed" ] && [ -z "$(printf '%s\n' "$changed" | grep -Ev '\.md$|^LICENSE$|^docs/|^skills/')" ]; then
              docs_only=true
            fi
          fi
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"
          echo "docs_only=$docs_only"

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Run docs-freshness tests
        if: steps.scope.outputs.docs_only == 'true'
        run: >-
          bundle exec ruby -Ilib -Itest -Irubocop-metz/lib -Irubocop-metz/test
          -e 'Dir[%(test/metz_scan/{readme_*,*skill*,read_only_command_docs,project_analyzer_calibration_docs,agent_workspace_docs}*_test.rb)].each { |f| require File.expand_path(f) }'

      - name: Run tests
        if: steps.scope.outputs.docs_only != 'true'
        run: bundle exec rake

      - name: Run RuboCop
        if: steps.scope.outputs.docs_only != 'true'
        run: bundle exec rubocop

      - name: Smoke calibration artifact output
        if: steps.scope.outputs.docs_only != 'true'
        run: bundle exec ruby bin/check_project_analyzer_calibration --text --no-write test/fixtures/sample_app

      - name: Smoke GitHub annotations output
        if: steps.scope.outputs.docs_only != 'true'
        run: |
          fixture_dir="$(mktemp -d)"
          cp -R test/fixtures/service_soup_app "$fixture_dir/service_soup_app"

          set +e
          bundle exec metz-scan scan "$fixture_dir/service_soup_app" \
            --project-analyzers \
            --format gh-annotations > /tmp/metz-gh-annotations.out
          status=$?
          set -e
          rm -rf "$fixture_dir"

          cat /tmp/metz-gh-annotations.out
          test "$status" -eq 1
          grep -q '^::warning file=.*MetzProject/ServiceSoup' /tmp/metz-gh-annotations.out

      - name: Check dependency direction
        run: bin/check_dependency_direction

      - name: Check sample app frozen
        run: bin/check_sample_app_frozen

      - name: Check read-only commands
        run: bundle exec bin/check_read_only_commands

  # Same checks with the optional rubydex bundle group installed, so the
  # index-backed (RubydexBackend) tests that skip in `test` actually run.
  # Not a required check; skipped for docs-only PRs via the `test` job's scope.
  rubydex:
    needs: test
    if: needs.test.outputs.docs_only != 'true'
    runs-on: ubuntu-24.04
    env:
      BUNDLE_WITH: rubydex

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      # Fails if rubydex does not load, so the steps below cannot silently fall
      # back to NullBackend.
      - name: Check dogfood
        run: bin/check_dogfood

      - name: Run tests
        run: bundle exec rake

      # Default targets are external app checkouts CI does not have; the sample
      # app output is pinned in test/fixtures/check_rubydex_drift/.
      - name: Check rubydex drift
        run: bundle exec bin/check_rubydex_drift --text test/fixtures/sample_app
