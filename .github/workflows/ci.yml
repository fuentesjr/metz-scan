name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Install dependencies
        run: bundle install

      - name: Run tests
        run: bundle exec rake

      - name: Run RuboCop
        run: bundle exec rubocop

      - name: Smoke GitHub annotations output
        run: |
          set +e
          bundle exec metz-scan scan test/fixtures/service_soup_app \
            --project-analyzers \
            --format gh-annotations > /tmp/metz-gh-annotations.out
          status=$?
          set -e

          cat /tmp/metz-gh-annotations.out
          test "$status" -eq 1
          grep -q '^::warning file=.*MetzProject/ServiceSoup' /tmp/metz-gh-annotations.out

      - name: Check dependency direction
        run: bin/check_dependency_direction

      - name: Check sample app frozen
        run: bin/check_sample_app_frozen
