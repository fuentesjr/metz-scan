name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Install dependencies
        run: bundle install

      - name: Run tests
        run: bundle exec rake

      - name: Run RuboCop
        run: bundle exec rubocop

      - name: Check dependency direction
        run: bin/check_dependency_direction

      - name: Check sample app frozen
        run: bin/check_sample_app_frozen
