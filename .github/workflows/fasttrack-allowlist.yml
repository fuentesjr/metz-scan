name: fasttrack-allowlist

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: read

jobs:
  fasttrack-allowlist:
    runs-on: ubuntu-24.04
    if: contains(github.event.pull_request.labels.*.name, 'fast-track')
    steps:
      - name: Checkout base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Setup Ruby
        uses: ruby/setup-ruby@be3c7df29b3349ec6bcfc6b4792f1cf9f5237d18 # v1.343.0
        with:
          ruby-version: .ruby-version
          bundler: none

      - name: Decide clearance
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ruby tools/fasttrack/fasttrack_allowlist.rb
