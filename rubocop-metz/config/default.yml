# Default configuration for the rubocop-metz plugin.

Metrics/ClassLength:
  Enabled: false

Metrics/MethodLength:
  Enabled: false

Metrics/ParameterLists:
  Enabled: false

Metz/ClassesTooLong:
  Description: 'Flags classes longer than the configured Max line count; the Metz default is stricter than core RuboCop.'
  Enabled: true
  Severity: refactor
  Max: 100
  CountComments: false
  CountAsOne: []

Metz/MethodsTooLong:
  Description: 'Flags methods longer than the configured Max line count; the Metz default is stricter than core RuboCop.'
  Enabled: true
  Severity: refactor
  Max: 5
  CountComments: false
  CountAsOne: []
  AllowedMethods: []
  AllowedPatterns: []

Metz/MethodsTooManyParameters:
  Description: 'Flags methods whose parameter list exceeds Max; the Metz default is stricter than core RuboCop.'
  Enabled: true
  Severity: refactor
  Max: 4

Metz/DemeterTrainWreck:
  Description: 'Detects Law-of-Demeter-violating object-graph traversal chains.'
  Enabled: true
  Severity: refactor
  Max: 4
  AllowedReceivers:
    - Rails
    - Arel
    - Time
    - Date
    - DateTime
  AllowedValueObjects:
    - String
    - Integer
    - Float
    - Symbol
    - Array
    - Hash
    - Set
  Exclude:
    - 'spec/**/*'
    - 'db/migrate/**/*'
  VersionAdded: '0.1'

Metz/TestReachesPrivate:
  Description: 'Flags tests that reach past the public interface with send/__send__ and a literal method name.'
  Enabled: false
  Severity: refactor
  Include:
    - '**/*_test.rb'
    - '**/test_*.rb'
    - '**/*_spec.rb'
  AllowedMethods:
    - define_method
    - remove_const
    - include
    - extend
    - prepend
    - alias_method
  AllowedReceivers: []
  VersionAdded: '0.6'

Metz/TestAssertsOnInternals:
  Description: 'Flags tests that assert on internal state via instance_variable_get/_set or Rails controller-test assigns.'
  Enabled: false
  Severity: refactor
  Include:
    - '**/*_test.rb'
    - '**/test_*.rb'
    - '**/*_spec.rb'
  AllowedReceivers: []
  VersionAdded: '0.6'

Metz/TestStubsSubject:
  Description: 'Flags RSpec tests that stub or mock the subject under test instead of its collaborators.'
  Enabled: false
  Severity: refactor
  Include:
    - '**/*_spec.rb'
  VersionAdded: '0.6'

Metz/ControllersTooManyDirectCollaborators:
  Description: 'Flags Rails controller actions that reach into more than MaxCollaborators distinct collaborator constants.'
  Enabled: true
  Severity: refactor
  MaxCollaborators: 1
  Include:
    - 'app/controllers/**/*.rb'
  VersionAdded: '0.1'

Metz/OperationsTooManyPublicMethods:
  Description: >-
    Flags classes under app/services or app/operations that expose more than
    MaxPublicMethods public methods (excluding AllowedMethods such as initialize).
  Enabled: true
  Severity: refactor
  MaxPublicMethods: 1
  AllowedMethods:
    - initialize
  Include:
    - 'app/services/**/*.rb'
    - 'app/operations/**/*.rb'
  VersionAdded: '0.6'

Metz/GodServiceClass:
  Description: >-
    Flags *Service classes that expose more than MaxPublicMethods public methods
    (excluding AllowedMethods such as initialize) — god-service / multi-use bags.
  Enabled: true
  Severity: refactor
  MaxPublicMethods: 1
  AllowedMethods:
    - initialize
  VersionAdded: '0.6'

Metz/ViewsDeepNavigation:
  Description: 'Flags Rails view templates whose ERB/HAML/SLIM expressions traverse the object graph deeper than MaxChainLength.'
  Enabled: true
  Severity: refactor
  MaxChainLength: 3
  Include:
    - 'app/views/**/*.{erb,haml,slim}'
  VersionAdded: '0.1'
