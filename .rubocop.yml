<%
test_excludes = %w[
  rubocop-metz/test/audit/**/*
  rubocop-metz/test/cop/**/*
  rubocop-metz/test/integration/**/*
  rubocop-metz/test/metz/**/*
  rubocop-metz/test/rubocop/**/*
  rubocop-metz/test/cop_helper_test.rb
  rubocop-metz/test/test_helper.rb
]
emit_test_excludes = lambda do |extra: []|
  (test_excludes + Array(extra)).map { |path| "    - #{path}" }.join("\n")
end
%>
plugins:
  - rubocop-metz

AllCops:
  TargetRubyVersion: 3.3
  NewCops: enable
  SuggestExtensions: false
  Include:
    - "**/*.rb"
    - "**/*.gemspec"
    - "**/Gemfile"
    - "**/Rakefile"
    - "**/*.erb"
    - "**/*.haml"
    - "**/*.slim"
  Exclude:
    - tmp/**/*
    - rubocop-metz/test/fixtures/**/*
    # Deliberate Rails fixture for the Rails-aware cops; integration tests that
    # scan it intentionally provide their own config instead of changing global
    # lint behavior based on raw command arguments.
    - test/fixtures/sample_app/**/*
    # Deliberate service-heavy Rails fixture for the wrapper-level
    # MetzProject/ServiceSoup prototype.
    - test/fixtures/service_soup_app/**/*
    # Deliberate setup-orchestration Rails fixture for low-confidence
    # MetzProject/ServiceSoup triage.
    - test/fixtures/service_soup_setup_app/**/*
    # Deliberate opt-in cop fixture used by scan integration tests.
    - test/fixtures/test_reaches_private_app/**/*

Style/StringLiterals:
  EnforcedStyle: double_quotes

Style/Documentation:
  Enabled: false

Gemspec/RequireMFA:
  Enabled: false

Naming/FileName:
  Exclude:
    - rubocop-metz/lib/rubocop-metz.rb

Metrics/MethodLength:
  Exclude:
<%= emit_test_excludes.call %>

Metz/MethodsTooLong:
  Exclude:
<%= emit_test_excludes.call %>

Metz/ClassesTooLong:
  Exclude:
<%= emit_test_excludes.call %>

Metrics/ModuleLength:
  Exclude:
<%= emit_test_excludes.call %>

Metrics/ClassLength:
  Exclude:
<%= emit_test_excludes.call %>

Metrics/AbcSize:
  Exclude:
<%= emit_test_excludes.call %>

Style/FormatStringToken:
  Exclude:
<%= emit_test_excludes.call %>

Style/OneClassPerFile:
  Exclude:
<%= emit_test_excludes.call %>
